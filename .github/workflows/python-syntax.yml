name: Pulse Quality and Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Repository auf offengelegte Geheimnisse prüfen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - name: Repository inklusive Historie auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks ausführen
        # Third-party action with GITHUB_TOKEN: pinned to the immutable commit of v3.0.0 (Dependabot keeps it current).
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Abhängigkeiten auf Sicherheitslücken prüfen
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python einrichten
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # Blocks the deploy (deploy-vps.yml follows this workflow): audit exactly what the image installs.
      - name: Abhängigkeiten auditieren (requirements.lock = Inhalt des Docker-Images)
        run: |
          python -m pip install --upgrade pip pip-audit==2.10.1
          pip-audit -r requirements.lock --require-hashes

  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python einrichten
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Abhaengigkeiten installieren (exakt die Versionen des Docker-Images)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install ruff==0.6.9
      - name: Lint (ruff, konservativ - siehe ruff.toml)
        run: |
          python -m ruff check .
      - name: Python-Syntax prüfen
        run: |
          python -m compileall -q .
      - name: Feature-Regressionstests
        run: |
          python tests/feature_smoke.py
          python tests/smoke_test.py
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Tests haben keine Laufzeit-JSON im Checkout angelegt
        # Phase 8: Tests dürfen nie team_data.json, audit_logs.json usw. im Arbeitsordner schreiben –
        # lokal (/pulse-verify) wäre das ein Checkout mit echten Teamdaten.
        run: |
          leaked=$(git status --porcelain --ignored --untracked-files=all -- '*.json' ':!node_modules' | grep -v '^ M' || true)
          if [ -n "$leaked" ]; then echo "Von Tests angelegt/verändert:"; echo "$leaked"; exit 1; fi

  e2e-scope:
    name: E2E nötig? (Pfadfilter)
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.scope.outputs.e2e }}
    steps:
      - name: Repository inklusive Historie auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Geänderte Dateien bewerten (tools/ci_e2e_needed.py)
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          # Zeitplan/manueller Start: immer komplett. Unbekannte Basis (neuer Branch, Force-Push): ebenfalls.
          if [[ "$EVENT" == "pull_request" ]]; then BASE="$PR_BASE"; elif [[ "$EVENT" == "push" ]]; then BASE="$PUSH_BEFORE"; else BASE=""; fi
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E läuft vollständig (Ereignis $EVENT, keine vergleichbare Basis)."
            exit 0
          fi
          git diff --name-only "$BASE" HEAD | tee changed.txt
          python3 tools/ci_e2e_needed.py < changed.txt

  e2e:
    name: Dashboard-E2E (Playwright, lokal mit Fake-Login)
    needs: e2e-scope
    if: needs.e2e-scope.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python einrichten
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Playwright-Browser aus dem Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.lock') }}
      - name: Abhaengigkeiten (Hash-geprüft aus requirements-dev.lock) und Chromium installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m playwright install --with-deps chromium
      - name: E2E-Tests ausfuehren
        env:
          PULSE_E2E: "1"
          PYTHONUTF8: "1"
        run: |
          python -m unittest tests.test_e2e_dashboard -v

  image:
    name: Docker-Image bauen (wie auf dem VPS, ohne Push)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compose-Konfiguration prüfen (Mounts, Limits; leere .env nur für die Prüfung)
        run: |
          touch .env
          docker compose config --quiet
          docker compose config --format json | python3 -c "import json,sys; v=json.load(sys.stdin)['services']['pulse']['volumes']; ro={x['target'] for x in v if x.get('read_only')}; need={'/app/.git','/app/compose.yaml','/app/Dockerfile','/app/deploy','/app/scripts','/app/systemd'}; sys.exit(0 if need<=ro else print('nicht schreibgeschützt:', need-ro) or 1)"
      - name: Image bauen
        run: |
          docker build --pull -t pulse-ci:${{ github.sha }} .
      - name: Laufzeitabhängigkeiten im Image prüfen
        run: |
          docker run --rm --entrypoint python pulse-ci:${{ github.sha }} -c "import discord, fastapi, uvicorn, httpx, nacl, davey, multipart, dotenv; print('imports ok')"
          docker run --rm --entrypoint ffmpeg pulse-ci:${{ github.sha }} -hide_banner -version
          test "$(docker run --rm --entrypoint id pulse-ci:${{ github.sha }} -u)" != "0"
