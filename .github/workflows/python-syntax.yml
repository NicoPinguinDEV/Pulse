name: Pulse Python Syntax Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff==0.6.9 pip-audit coverage
      - name: Lint (ruff, konservativ - siehe ruff.toml)
        run: |
          python -m ruff check .
      - name: Abhängigkeiten auf bekannte Sicherheitslücken prüfen
        run: python -m pip_audit -r requirements.txt
      - name: Python-Syntax prüfen
        run: |
          python -m compileall -q .
      - name: Deployment-Skript syntaktisch prüfen
        run: bash -n tools/deploy_remote.sh
      - name: Feature-Regressionstests
        run: |
          python tests/feature_smoke.py
          python tests/smoke_test.py
          coverage run -m unittest discover -s tests -p 'test_*.py'
          coverage report
