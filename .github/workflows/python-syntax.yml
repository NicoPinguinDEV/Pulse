name: Pulse Quality and Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Repository auf offengelegte Geheimnisse prüfen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - name: Repository inklusive Historie auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks ausführen
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Abhängigkeiten auf Sicherheitslücken prüfen
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Abhängigkeiten auditieren
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt

  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff==0.6.9
      - name: Lint (ruff, konservativ - siehe ruff.toml)
        run: |
          python -m ruff check .
      - name: Python-Syntax prüfen
        run: |
          python -m compileall -q .
      - name: Feature-Regressionstests
        run: |
          python tests/feature_smoke.py
          python tests/smoke_test.py
          python -m unittest discover -s tests -p 'test_*.py'
