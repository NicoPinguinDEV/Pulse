# O-04: supply chain and secrets. Deliberately a separate workflow: a finding here never blocks the
# deploy (that only follows "Pulse Python Syntax Check"), it shows up as a red check to look at.
name: Pulse Sicherheit & Abdeckung

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"   # weekly, Monday morning – new advisories for unchanged code
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock-audit:
    name: Lock-Datei (Hashes) + pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Abhängigkeiten exakt aus requirements.lock (mit Hash-Prüfung)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
      - name: Bekannte Sicherheitslücken (pip-audit)
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.lock --require-hashes --desc
      - name: Tests mit Abdeckung
        env:
          PYTHONUTF8: "1"
          PYTHONPATH: "."
        run: |
          python -m pip install coverage
          python -m coverage run -m unittest discover -s tests -p 'test_*.py'
          python -m coverage report --skip-empty --sort=cover | tail -n 40
          python -m coverage xml -o coverage.xml
      - name: Abdeckungsbericht hochladen
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14

  secrets:
    name: Secret-Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
