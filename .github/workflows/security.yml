# O-04: supply chain (hash-checked lock) and coverage. Deliberately a separate workflow: a finding here never
# blocks the deploy (that only follows "Pulse Quality and Security Checks"), it shows up as a red check to look at.
# The gitleaks secret scan runs once, in python-syntax.yml (job secret-scan, same triggers, full history) – it was
# duplicated here before and ran twice per push/PR.
name: Pulse Sicherheit & Abdeckung

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"   # weekly, Monday morning – new advisories for unchanged code
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock-audit:
    name: Lock-Datei (Hashes) + pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Abhängigkeiten exakt aus requirements.lock (mit Hash-Prüfung)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
      - name: Bekannte Sicherheitslücken (pip-audit)
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements.lock --require-hashes --desc
      - name: Tests mit Abdeckung
        env:
          PYTHONUTF8: "1"
          PYTHONPATH: "."
        run: |
          python -m pip install coverage==7.17.0
          python -m coverage run -m unittest discover -s tests -p 'test_*.py'
          python -m coverage report --skip-empty --sort=cover | tail -n 40
          python -m coverage xml -o coverage.xml
      - name: Abdeckungsbericht hochladen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14
