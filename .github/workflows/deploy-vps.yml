name: Deploy Pulse VPS

on:
  workflow_run:
    workflows: ["Pulse Python Syntax Check"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: pulse-vps-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Geprüften Commit auf dem Pulse-VPS ausrollen
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Geprüften Commit auschecken
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      
      - name: Exakten Commit gegen erfolgreichen Push-CI-Lauf prüfen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Ungültige Ziel-SHA."
            exit 1
          fi
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&per_page=100")"
          if ! jq -e --arg sha "$TARGET_SHA" '
            .workflow_runs[]
            | select(
                .name == "Pulse Python Syntax Check"
                and .head_sha == $sha
                and .event == "push"
                and .conclusion == "success"
              )
          ' <<< "$runs" >/dev/null; then
            echo "::error::Für genau diese SHA wurde kein erfolgreicher Push-CI-Lauf gefunden. Kein Deployment."
            exit 1
          fi

      - name: Deployment-Secrets prüfen
        id: setup
        env:
          VPS_HOST: ${{ secrets.PULSE_VPS_HOST }}
          VPS_USER: ${{ secrets.PULSE_VPS_USER }}
          VPS_KEY: ${{ secrets.PULSE_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.PULSE_VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          if [[ -z "$VPS_HOST" || -z "$VPS_USER" || -z "$VPS_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS-Deployment übersprungen. Richte zuerst die vier PULSE_VPS_* Repository-Secrets ein."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: SSH vorbereiten
        if: steps.setup.outputs.enabled == 'true'
        env:
          VPS_KEY: ${{ secrets.PULSE_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.PULSE_VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_KEY" > "$HOME/.ssh/pulse_vps"
          chmod 600 "$HOME/.ssh/pulse_vps"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Backup, Commit-Deploy, Health-Check und Rollback
        if: steps.setup.outputs.enabled == 'true'
        env:
          VPS_HOST: ${{ secrets.PULSE_VPS_HOST }}
          VPS_USER: ${{ secrets.PULSE_VPS_USER }}
          VPS_PORT: ${{ secrets.PULSE_VPS_SSH_PORT }}
        shell: bash
        run: |
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Kein gültiger Commit-SHA vom erfolgreichen CI-Lauf."
            exit 1
          fi
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" \
            -i "$HOME/.ssh/pulse_vps" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "bash -s -- '$TARGET_SHA'" < tools/deploy_remote.sh
