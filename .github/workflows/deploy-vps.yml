name: Deploy Pulse VPS

on:
  workflow_run:
    workflows: ["Pulse Quality and Security Checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Optional: deploy this exact main commit (must have passing security checks)"
        required: false
        type: string

permissions:
  actions: read
  contents: read

# O-03: never two deploys at the same time; a newer one waits instead of interrupting a running deploy.
concurrency:
  group: pulse-vps-production
  cancel-in-progress: false

jobs:
  deploy:
    name: GitHub main → Pulse VPS
    # No production deploy just because CI went green: the workflow_run trigger only deploys when the repository
    # variable PULSE_AUTO_DEPLOY is explicitly "true" (Settings → Secrets and variables → Actions → Variables).
    # Default (unset): only a manual "Run workflow" deploys. The environment "production" can additionally require
    # a reviewer approval (Settings → Environments → production → Required reviewers).
    if: github.event_name == 'workflow_dispatch' || vars.PULSE_AUTO_DEPLOY == 'true'
    environment: production
    runs-on: ubuntu-latest
    # O-03 / M-A4-1: every step uses steps.verified.outputs.sha – exactly the commit the checks ran on, never the
    # ref a manual run was dispatched from (that ref's deploy script would otherwise run on the VPS).
    steps:
      - name: Geprüften Commit bestimmen
        id: verified
        uses: actions/github-script@v9
        with:
          script: |
            const isManual = context.eventName === "workflow_dispatch";
            if (!isManual) {
              const run = context.payload.workflow_run;
              if (
                !run ||
                run.conclusion !== "success" ||
                run.event !== "push" ||
                run.head_branch !== "main"
              ) {
                core.setFailed("Deployment nur nach erfolgreichen Sicherheitsprüfungen eines main-Pushes.");
                return;
              }
              core.setOutput("sha", run.head_sha);
              return;
            }

            // The workflow file and deploy script come from the dispatched ref – only main may deploy.
            // (Hard guarantee only with a deployment branch policy on the "production" environment.)
            if (context.ref !== "refs/heads/main") {
              core.setFailed(`Manuelles Deployment nur von main aus starten (gestartet von ${context.ref}).`);
              return;
            }
            const sha = (context.payload.inputs?.commit_sha || context.sha).trim();
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              core.setFailed("Bitte eine gültige vollständige Commit-SHA angeben.");
              return;
            }

            const result = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "python-syntax.yml",
              head_sha: sha,
              per_page: 100,
            });
            const latestMainPush = result.data.workflow_runs.find(run =>
              run.head_sha === sha &&
              run.head_branch === "main" &&
              run.event === "push"
            );
            if (!latestMainPush || latestMainPush.status !== "completed" || latestMainPush.conclusion !== "success") {
              core.setFailed("Für diesen Commit wurde kein erfolgreicher Sicherheits- und Qualitätstest auf main gefunden.");
              return;
            }
            core.setOutput("sha", sha);

      - name: Deployment-Secrets prüfen
        id: setup
        env:
          VPS_HOST: ${{ secrets.PULSE_VPS_HOST }}
          VPS_USER: ${{ secrets.PULSE_VPS_USER }}
          VPS_KEY: ${{ secrets.PULSE_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.PULSE_VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          if [[ -z "$VPS_HOST" || -z "$VPS_USER" || -z "$VPS_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::error::VPS-Deployment nicht ausgeführt: Richte zuerst die vier PULSE_VPS_* Repository-Secrets ein."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Geprüften Stand auschecken (für das Deploy-Skript)
        if: steps.setup.outputs.enabled == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.verified.outputs.sha }}

      - name: SSH vorbereiten
        if: steps.setup.outputs.enabled == 'true'
        env:
          VPS_KEY: ${{ secrets.PULSE_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.PULSE_VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_KEY" > "$HOME/.ssh/pulse_vps"
          chmod 600 "$HOME/.ssh/pulse_vps"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Backup, Deploy, Health-Check, ggf. Rollback
        id: deploy
        if: steps.setup.outputs.enabled == 'true'
        env:
          VPS_HOST: ${{ secrets.PULSE_VPS_HOST }}
          VPS_USER: ${{ secrets.PULSE_VPS_USER }}
          VPS_PORT: ${{ secrets.PULSE_VPS_SSH_PORT }}
          DEPLOY_SHA: ${{ steps.verified.outputs.sha }}
        shell: bash
        run: |
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Geprüfte Commit-SHA fehlt oder ist ungültig."
            exit 1
          fi
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" \
            -i "$HOME/.ssh/pulse_vps" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "bash -s -- '$DEPLOY_SHA' /opt/pulse/Pulse" < deploy/remote_deploy.sh

      - name: Ergebnis in den Alert-Kanal melden (optional)
        if: always() && steps.setup.outputs.enabled == 'true'
        env:
          WEBHOOK: ${{ secrets.PULSE_DEPLOY_WEBHOOK_URL }}
          OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_SHA: ${{ steps.verified.outputs.sha }}
        shell: bash
        run: |
          if [[ -z "$WEBHOOK" ]]; then
            echo "::notice::Kein PULSE_DEPLOY_WEBHOOK_URL gesetzt – keine Discord-Meldung."
            exit 0
          fi
          if [[ "$OUTCOME" == "success" ]]; then TEXT="✅ Pulse-Deploy ${DEPLOY_SHA:0:7} erfolgreich."; else TEXT="⚠️ Pulse-Deploy ${DEPLOY_SHA:0:7} fehlgeschlagen – Rollback versucht, bitte Actions-Log prüfen."; fi
          python3 -c 'import json, os, sys; print(json.dumps({"content": sys.argv[1], "allowed_mentions": {"parse": []}}))' "$TEXT" \
            | curl -fsS -H "Content-Type: application/json" -d @- "$WEBHOOK" >/dev/null || echo "::warning::Discord-Meldung fehlgeschlagen."
