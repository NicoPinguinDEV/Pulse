name: Deploy Pulse VPS

on:
  workflow_run:
    workflows:
      - "Pulse Quality and Security Checks"
      - "Pulse Sicherheit & Abdeckung"
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Optional: deploy this exact main commit (must have passing security checks)"
        required: false
        type: string

permissions:
  actions: read
  contents: read

# O-03: never two deploys at the same time; a newer one waits instead of interrupting a running deploy.
concurrency:
  group: pulse-vps-production
  cancel-in-progress: false

jobs:
  deploy:
    name: GitHub main → Pulse VPS
    # Automatic deployment is opt-in and requires both CI workflows to finish successfully for the same main commit.
    # The main branch must also be protected; otherwise deployment fails closed until Issue #121 is completed.
    # Manual deployment follows the exact same branch-protection and CI gates.
    if: github.event_name == 'workflow_dispatch' || (vars.PULSE_AUTO_DEPLOY == 'true' && github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
    environment: production
    runs-on: ubuntu-latest
    # O-03 / M-A4-1: every step uses steps.verified.outputs.sha – exactly the commit the checks ran on, never the
    # ref a manual run was dispatched from (that ref's deploy script would otherwise run on the VPS).
    steps:
      - name: Geprüften Commit bestimmen
        id: verified
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const isManual = context.eventName === "workflow_dispatch";
            const triggerRun = context.payload.workflow_run;

            const stopAutomaticDeployment = (message) => {
              core.setOutput("ready", "false");
              core.notice(message);
            };

            if (isManual && context.ref !== "refs/heads/main") {
              core.setFailed(`Manuelles Deployment nur von main aus starten (gestartet von ${context.ref}).`);
              return;
            }

            if (
              !isManual &&
              (!triggerRun ||
                triggerRun.event !== "push" ||
                triggerRun.head_branch !== "main" ||
                triggerRun.conclusion !== "success")
            ) {
              stopAutomaticDeployment("Kein Deployment: Auslöser ist kein erfolgreicher main-Push.");
              return;
            }

            const sha = (isManual
              ? (context.payload.inputs?.commit_sha || context.sha)
              : triggerRun.head_sha).trim();
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              core.setFailed("Bitte eine gültige vollständige Commit-SHA angeben.");
              return;
            }

            // Fail closed: GitHub's branch endpoint exposes whether main is protected.
            const branch = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: "main",
            });
            if (branch.data.protected !== true) {
              const message = "Deployment blockiert: GitHub meldet main als ungeschützt (protected=false). Aktiviere Branch Protection oder ein Ruleset für main und erfülle Issue #121.";
              if (isManual) core.setFailed(message);
              else stopAutomaticDeployment(message);
              return;
            }

            const workflows = [
              {
                workflow_id: "python-syntax.yml",
                label: "Pulse Quality and Security Checks",
                required_jobs: [
                  "Docker-Compose-Integration (read-only, /data, ohne Discord)",
                  "Abhängigkeiten auf Sicherheitslücken prüfen",
                  "Regressionstests mit der Python-Version des Images",
                  "syntax",
                  "Docker-Image bauen (wie auf dem VPS, ohne Push)",
                  "E2E nötig? (Pfadfilter)",
                  "Repository auf offengelegte Geheimnisse prüfen",
                ],
                allowed_skipped_jobs: [
                  "Dashboard-E2E (Playwright, lokal mit Fake-Login)",
                  "Schichthistorie – 20.000 Einträge (JSON vs. SQLite)",
                ],
              },
              {
                workflow_id: "security.yml",
                label: "Pulse Sicherheit & Abdeckung",
                required_jobs: ["Lock-Datei (Hashes) + pip-audit"],
                allowed_skipped_jobs: [],
              },
            ];

            const checks = [];
            for (const workflow of workflows) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow.workflow_id,
                head_sha: sha,
                per_page: 100,
              });
              const candidates = response.data.workflow_runs
                .filter(run =>
                  run.head_sha === sha &&
                  run.head_branch === "main" &&
                  run.event === "push"
                )
                .sort((a, b) =>
                  Date.parse(b.created_at) - Date.parse(a.created_at) ||
                  (b.run_attempt || 1) - (a.run_attempt || 1) ||
                  b.id - a.id
                );
              const run = candidates[0];

              if (!run || run.status !== "completed" || run.conclusion !== "success") {
                checks.push({
                  workflow: workflow.label,
                  ok: false,
                  reason: "Kein vollständig erfolgreicher main-Push-Lauf für diesen Commit.",
                });
                continue;
              }

              const jobsResponse = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              });
              const jobs = jobsResponse.data.jobs || [];
              const jobNames = new Set(jobs.map(job => job.name));
              const missingJobs = workflow.required_jobs.filter(name => !jobNames.has(name));
              const allowedSkips = new Set(workflow.allowed_skipped_jobs);
              const blockingJobs = jobs.filter(job =>
                job.conclusion !== "success" &&
                !(job.conclusion === "skipped" && allowedSkips.has(job.name))
              );

              if (jobs.length === 0 || missingJobs.length > 0 || blockingJobs.length > 0) {
                const details = [
                  missingJobs.length ? `fehlende Pflichtjobs: ${missingJobs.join(", ")}` : "",
                  blockingJobs.length
                    ? `nicht erfolgreiche oder unerwartet übersprungene Jobs: ${blockingJobs.map(job => `${job.name} (${job.conclusion || job.status})`).join(", ")}`
                    : "",
                  jobs.length === 0 ? "keine Job-Ergebnisse vorhanden" : "",
                ].filter(Boolean).join("; ");
                checks.push({ workflow: workflow.label, ok: false, reason: details });
                continue;
              }

              checks.push({ workflow: workflow.label, ok: true, run });
            }

            const failedChecks = checks.filter(check => !check.ok);
            if (failedChecks.length > 0) {
              const message = `Deployment blockiert: ${failedChecks.map(check => `${check.workflow}: ${check.reason}`).join(" | ")}`;
              if (isManual) core.setFailed(message);
              else stopAutomaticDeployment(message);
              return;
            }

            if (!isManual) {
              // Both workflow_run events may arrive after both workflows have finished.
              // Only the event belonging to the later-completed CI run is allowed to deploy.
              const latestCompletedRun = checks
                .map(check => check.run)
                .sort((a, b) =>
                  Date.parse(a.completed_at || a.updated_at) -
                  Date.parse(b.completed_at || b.updated_at) ||
                  a.id - b.id
                )
                .at(-1);
              if (triggerRun.id !== latestCompletedRun.id) {
                stopAutomaticDeployment("Kein Deployment: Der andere CI-Workflow wurde später abgeschlossen und übernimmt den gemeinsamen Deployment-Gate.");
                return;
              }
            }

            core.setOutput("ready", "true");
            core.setOutput("sha", sha);

      - name: Deployment-Secrets prüfen
        id: setup
        if: steps.verified.outputs.ready == 'true'
        env:
          VPS_HOST: ${{ secrets.PULSE_VPS_HOST }}
          VPS_USER: ${{ secrets.PULSE_VPS_USER }}
          VPS_KEY: ${{ secrets.PULSE_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.PULSE_VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          if [[ -z "$VPS_HOST" || -z "$VPS_USER" || -z "$VPS_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::error::VPS-Deployment nicht ausgeführt: Richte zuerst die vier PULSE_VPS_* Repository-Secrets ein."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Geprüften Stand auschecken (für das Deploy-Skript)
        if: steps.verified.outputs.ready == 'true' && steps.setup.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.verified.outputs.sha }}

      - name: SSH vorbereiten
        if: steps.setup.outputs.enabled == 'true'
        env:
          VPS_KEY: ${{ secrets.PULSE_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.PULSE_VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_KEY" > "$HOME/.ssh/pulse_vps"
          chmod 600 "$HOME/.ssh/pulse_vps"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Backup, Deploy, Health-Check, ggf. Rollback
        id: deploy
        if: steps.setup.outputs.enabled == 'true'
        env:
          VPS_HOST: ${{ secrets.PULSE_VPS_HOST }}
          VPS_USER: ${{ secrets.PULSE_VPS_USER }}
          VPS_PORT: ${{ secrets.PULSE_VPS_SSH_PORT }}
          DEPLOY_SHA: ${{ steps.verified.outputs.sha }}
        shell: bash
        run: |
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Geprüfte Commit-SHA fehlt oder ist ungültig."
            exit 1
          fi
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" \
            -i "$HOME/.ssh/pulse_vps" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "bash -s -- '$DEPLOY_SHA' /opt/pulse/Pulse" < deploy/remote_deploy.sh

      - name: Ergebnis in den Alert-Kanal melden (optional)
        if: always() && steps.verified.outputs.ready == 'true' && steps.setup.outputs.enabled == 'true'
        env:
          WEBHOOK: ${{ secrets.PULSE_DEPLOY_WEBHOOK_URL }}
          OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_SHA: ${{ steps.verified.outputs.sha }}
        shell: bash
        run: |
          if [[ -z "$WEBHOOK" ]]; then
            echo "::notice::Kein PULSE_DEPLOY_WEBHOOK_URL gesetzt – keine Discord-Meldung."
            exit 0
          fi
          if [[ "$OUTCOME" == "success" ]]; then TEXT="✅ Pulse-Deploy ${DEPLOY_SHA:0:7} erfolgreich."; else TEXT="⚠️ Pulse-Deploy ${DEPLOY_SHA:0:7} fehlgeschlagen – Rollback versucht, bitte Actions-Log prüfen."; fi
          python3 -c 'import json, os, sys; print(json.dumps({"content": sys.argv[1], "allowed_mentions": {"parse": []}}))' "$TEXT" \
            | curl -fsS -H "Content-Type: application/json" -d @- "$WEBHOOK" >/dev/null || echo "::warning::Discord-Meldung fehlgeschlagen."
