services:
  pulse:
    build:
      context: .
      dockerfile: Dockerfile
      # Phase 13: the installed commit travels as build information (no .git inside the container).
      args:
        PULSE_GIT_SHA: ${PULSE_GIT_SHA:-}
        PULSE_GIT_BRANCH: ${PULSE_GIT_BRANCH:-}
    container_name: pulse-teamos
    # systemd updates GitHub main before Pulse starts on every VPS boot.
    # Avoid racing ahead with an old checkout while the update service runs.
    restart: "no"
    init: true
    # VPS has 2 GiB RAM: reserve room for Ubuntu, Docker, Caddy and other host services.
    # Pulse may use up to 768 MiB RAM and 256 MiB additional swap (1,024 MiB combined).
    mem_limit: 768m
    memswap_limit: 1024m
    # Container hardening: Pulse runs as UID 1000, binds an unprivileged port and needs no Linux capability.
    # no-new-privileges blocks setuid binaries of the base image (su, mount); pids_limit stops a fork bomb from
    # taking down the 2-GiB host (Python threads + ffmpeg stay far below).
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    # Phase 13 (SEC R-05 / D-06): the root filesystem – and with it the code in /app – is read-only. Pulse writes
    # only to /data (runtime data, logs, TMPDIR) and to a small /tmp in RAM.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,nosuid,nodev,noexec
    # .env stays on the host: compose reads it and passes the values as environment variables – the file itself
    # is not inside the container (neither readable nor writable for Pulse).
    env_file:
      - .env
    environment:
      SERVER_PORT: ${SERVER_PORT:-25095}
      # Fixed on purpose (no ${...} from .env): an old PULSE_DB_PATH=/app/pulse.db must not point into the code.
      PULSE_DATA_DIR: /data
      PULSE_DB_PATH: /data/pulse.db
      TMPDIR: /data/tmp
      # O-02: X-Forwarded-For is trusted only from the Caddy container (fixed address below) or from the
      # network gateway 172.30.0.1, through which a reverse proxy on the host reaches the loopback-published
      # port – never from the internet, so nobody can fake an IP to dodge the rate limit or the login audit.
      PULSE_FORWARDED_ALLOW_IPS: ${PULSE_FORWARDED_ALLOW_IPS:-172.30.0.10,172.30.0.1}
    ports:
      # O-02 + main: bound to localhost by default; the HTTPS reverse proxy (host or Caddy profile "https")
      # serves the dashboard. Only set PULSE_PUBLISH_HOST=0.0.0.0 if the port must be reachable directly.
      - "${PULSE_PUBLISH_HOST:-127.0.0.1}:${SERVER_PORT:-25095}:${SERVER_PORT:-25095}"
    networks:
      pulse_net:
        ipv4_address: 172.30.0.2
    volumes:
      # Phase 13 (D-06): only the data directory is mounted – no part of the checkout. Config, JSON state, SQLite
      # databases, uploads, attachments, transcripts, backups, the uploaded waiting music and logs stay on the host
      # (/opt/pulse/data) across image rebuilds, deploys and rollbacks. The checkout (.git, deploy/, scripts/,
      # systemd/, compose.yaml, .env) is invisible to the container, so a compromised Pulse process cannot plant
      # anything that root later executes. create_host_path: false – a missing data directory stops the start
      # instead of Docker creating an empty one (scripts/pulse_migrate_data.py prepares it).
      - type: bind
        source: ${PULSE_DATA_HOST_DIR:-/opt/pulse/data}
        target: /data
        bind:
          create_host_path: false
      # Server Control Center: only the socket folder of the host agent (docs/SERVER_CONTROL_CENTER.md), at the
      # same path as before so PULSE_HOST_AGENT_URL=unix:///app/.pulse-agent/agent.sock keeps working. The deploy
      # and boot scripts create it for UID 1000; it holds nothing root executes.
      - ./.pulse-agent:/app/.pulse-agent
    working_dir: /app
    stop_grace_period: 40s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${SERVER_PORT:-25095}/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # O-02: optional HTTPS with automatic certificates. Start with:  docker compose --profile https up -d
  # Needs PULSE_DOMAIN in .env and DNS pointing to this server; ports 80/443 open.
  caddy:
    image: caddy:2.8-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [pulse]
    environment:
      PULSE_DOMAIN: ${PULSE_DOMAIN:-}
      PULSE_UPSTREAM: pulse:${SERVER_PORT:-25095}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    networks:
      pulse_net:
        ipv4_address: 172.30.0.10

networks:
  pulse_net:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  caddy_data:
  caddy_config:
